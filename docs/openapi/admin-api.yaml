# Admin API — aligned with FastAPI Pydantic schemas

openapi: 3.0.3
info:
  title: MujahidMusic Admin API
  version: 1.0.0
  description: BFF for admin-web (port 8080). Auth via Bearer ADMIN_API_KEY.

servers:
  - url: http://localhost:8080

security:
  - AdminBearer: []

paths:
  /api/admin/status:
    get:
      summary: Service and dependency status
      responses:
        "200":
          description: Status snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"

  /api/admin/metrics/summary:
    get:
      summary: Aggregated Prometheus counters from bot
      responses:
        "200":
          description: Metrics summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsSummary"

  /api/admin/sessions:
    get:
      summary: Live playback sessions
      responses:
        "200":
          description: Sessions from bot control plane
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionsResponse"

  /api/admin/sessions/{guildId}:
    get:
      summary: Session queue detail
      parameters:
        - name: guildId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Queue tracks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QueueTrack"
        "404":
          description: No active session

  /api/admin/sessions/{guildId}/skip:
    post:
      summary: Skip track (moderation)
      parameters:
        - name: guildId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Skipped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"
        "429":
          description: Rate limit exceeded

  /api/admin/sessions/{guildId}/stop:
    post:
      summary: Stop playback (moderation)
      parameters:
        - name: guildId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"

  /api/admin/sessions/{guildId}/leave:
    post:
      summary: Force leave voice (moderation)
      parameters:
        - name: guildId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Left
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"

  /api/admin/guilds:
    get:
      summary: All bot guilds
      responses:
        "200":
          description: Guild list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Guild"

  /api/admin/playlists:
    get:
      summary: List playlists with pagination
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 50
        - name: ownerId
          in: query
          schema:
            type: string
        - name: name
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Paginated playlists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedPlaylists"

  /api/admin/playlists/stats:
    get:
      summary: Playlist statistics
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistStats"

  /api/admin/playlists/{ownerId}/{name}:
    get:
      summary: Playlist tracks
      parameters:
        - name: ownerId
          in: path
          required: true
          schema:
            type: string
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Playlist detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistDetail"
        "404":
          description: Playlist not found
    delete:
      summary: Delete playlist
      parameters:
        - name: ownerId
          in: path
          required: true
          schema:
            type: string
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Playlist not found

  /api/admin/audit:
    get:
      summary: Admin audit log
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedAudit"

components:
  securitySchemes:
    AdminBearer:
      type: http
      scheme: bearer

  schemas:
    StatusResponse:
      type: object
      properties:
        status:
          type: string
        uptimeSeconds:
          type: integer
        botReachable:
          type: boolean
        mongoReachable:
          type: boolean
        environment:
          type: string

    MetricsSummary:
      type: object
      properties:
        guilds_total:
          type: integer
        active_players:
          type: integer
        commands:
          type: array
          items:
            type: object
            properties:
              command:
                type: string
              count:
                type: integer
              errors:
                type: integer
        track_load_failures:
          type: array
          items:
            type: object
        playlist_ops:
          type: array
          items:
            type: object

    SessionsResponse:
      type: object
      properties:
        nodes:
          type: array
          items:
            type: object
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/Session"

    Session:
      type: object
      properties:
        guildId:
          type: string
        guildName:
          type: string
        trackTitle:
          type: string
          nullable: true
        trackAuthor:
          type: string
          nullable: true
        positionMs:
          type: integer
        lengthMs:
          type: integer
        paused:
          type: boolean
        volume:
          type: integer
        queueSize:
          type: integer
        loopMode:
          type: string

    QueueTrack:
      type: object
      properties:
        position:
          type: integer
        title:
          type: string
        author:
          type: string
        uri:
          type: string
        durationMs:
          type: integer

    ActionResponse:
      type: object
      properties:
        status:
          type: string

    Guild:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        memberCount:
          type: integer

    PaginatedPlaylists:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              ownerId:
                type: string
              name:
                type: string
              trackCount:
                type: integer
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    PlaylistStats:
      type: object
      properties:
        totalPlaylists:
          type: integer
        totalTracks:
          type: integer
        topOwners:
          type: array
          items:
            type: object

    PlaylistDetail:
      type: object
      properties:
        ownerId:
          type: string
        name:
          type: string
        tracks:
          type: array
          items:
            type: object
            properties:
              encoded:
                type: string
              title:
                type: string
              uri:
                type: string

    PaginatedAudit:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              action:
                type: string
              target:
                type: string
              at:
                type: string
                nullable: true
              ip:
                type: string
                nullable: true
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

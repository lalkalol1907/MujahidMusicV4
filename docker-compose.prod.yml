# Production: pre-built images from Docker Hub (bot, admin-api, admin-web) + Lavalink + MongoDB.
# Requires IMAGE_NAME, ADMIN_API_IMAGE_NAME, ADMIN_WEB_IMAGE_NAME, IMAGE_TAG in .env.
services:
  bot:
    image: ${IMAGE_NAME}:${IMAGE_TAG}
    labels:
      scraper.name: mujahid-bot
    env_file:
      - .env
    networks:
      - mujahid-network
    environment:
      LAVALINK_HOST: lavalink
      LAVALINK_PORT: "2333"
      MONGO_URI: mongodb://${MONGO_USER:-mujahid}:${MONGO_PASSWORD:-changeme}@mongo:27017/?authSource=admin
      METRICS_PORT: "9090"
      INTERNAL_PORT: "9091"
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    expose:
      - "9090"
      - "9091"
    depends_on:
      lavalink:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: unless-stopped

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4.2.2
    labels:
      scraper.name: lavalink
    env_file:
      - .env
    networks:
      - mujahid-network
    environment:
      - LAVALINK_PASSWORD=${LAVALINK_PASSWORD:-youshallnotpass}
      - _JAVA_OPTIONS=-Xmx512m
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -H 'Authorization: ${LAVALINK_PASSWORD:-youshallnotpass}' http://localhost:2333/version || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mongo:
    image: mongo:7
    labels:
      scraper.name: mujahid-mongo
    env_file:
      - .env
    ports:
      - "${MONGO_PORT:-27017}:27017"
    networks:
      - mujahid-network
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-mujahid}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-changeme}
    volumes:
      - ./mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh -u \"${MONGO_USER:-mujahid}\" -p \"${MONGO_PASSWORD:-changeme}\" --authenticationDatabase admin --quiet --eval \"db.adminCommand({ping:1})\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  admin-api:
    image: ${ADMIN_API_IMAGE_NAME}:${IMAGE_TAG}
    labels:
      scraper.name: mujahid-admin-api
    env_file:
      - .env
    networks:
      - mujahid-network
    environment:
      BOT_INTERNAL_URL: http://bot:9091
      BOT_METRICS_URL: http://bot:9090
      MONGO_URI: mongodb://${MONGO_USER:-mujahid}:${MONGO_PASSWORD:-changeme}@mongo:27017/?authSource=admin
      MONGO_DB: ${MONGO_DB:-mujahid}
      ENVIRONMENT: production
    depends_on:
      bot:
        condition: service_started
      mongo:
        condition: service_healthy
    restart: unless-stopped

  admin-web:
    image: ${ADMIN_WEB_IMAGE_NAME}:${IMAGE_TAG}
    labels:
      scraper.name: mujahid-admin-web
    networks:
      - mujahid-network
    ports:
      - "${ADMIN_WEB_PORT:-3000}:80"
    depends_on:
      - admin-api
    restart: unless-stopped

networks:
  mujahid-network:
    external: false

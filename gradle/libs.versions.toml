[versions]
jda = "6.4.1"
lavalinkClient = "3.4.0"
mongodb = "5.8.0"
logback = "1.5.12"
dotenv = "3.2.0"
shadow = "8.3.5"
junit = "5.11.4"
mockito = "5.14.2"
micrometer = "1.13.6"

[libraries]
jda = { module = "net.dv8tion:JDA", version.ref = "jda" }
lavalink-client = { module = "dev.arbjerg:lavalink-client", version.ref = "lavalinkClient" }
mongodb-driver-sync = { module = "org.mongodb:mongodb-driver-sync", version.ref = "mongodb" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
dotenv-java = { module = "io.github.cdimascio:dotenv-java", version.ref = "dotenv" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }
micrometer-core = { module = "io.micrometer:micrometer-core", version.ref = "micrometer" }
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus", version.ref = "micrometer" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }

name: CI

# push / pull_request — test на любых ветках и PR.
# build + deploy — только при push тега v* (refs/tags/v1.0.0 и т.д.).
# workflow_dispatch — ручной запуск test (без сборки и деплоя).
on:
  workflow_dispatch:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: temurin
          cache: gradle

      - name: Run Bot Unit Tests
        run: ./gradlew test --no-daemon

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Admin API Tests
        run: |
          pip install -e "./admin-api[dev]"
          pytest admin-api/tests -q

  build:
    name: Build ${{ matrix.component }}
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [bot, admin-api, admin-web]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve build context
        id: ctx
        run: |
          REPO="${{ github.event.repository.name }}"
          USER="${{ secrets.DOCKERHUB_USERNAME }}"
          case "${{ matrix.component }}" in
            bot)
              echo "image=${USER}/${REPO}" >> "$GITHUB_OUTPUT"
              echo "context=." >> "$GITHUB_OUTPUT"
              echo "dockerfile=Dockerfile" >> "$GITHUB_OUTPUT"
              ;;
            admin-api)
              echo "image=${USER}/${REPO}-admin-api" >> "$GITHUB_OUTPUT"
              echo "context=./admin-api" >> "$GITHUB_OUTPUT"
              echo "dockerfile=admin-api/Dockerfile" >> "$GITHUB_OUTPUT"
              ;;
            admin-web)
              echo "image=${USER}/${REPO}-admin-web" >> "$GITHUB_OUTPUT"
              echo "context=./admin-web" >> "$GITHUB_OUTPUT"
              echo "dockerfile=admin-web/Dockerfile" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log In to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ctx.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.ctx.outputs.context }}
          file: ${{ steps.ctx.outputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  # Только push тега v*; после успешной сборки всех образов.
  # Секреты: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_PATH, DEPLOY_DOTENV;
  # DOCKERHUB_USERNAME + DOCKERHUB_TOKEN — для docker login на сервере.
  deploy:
    name: Deploy
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_DOTENV: ${{ secrets.DEPLOY_DOTENV }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          IMAGE_TAG: ${{ github.ref_name }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          passphrase: ${{ secrets.DEPLOY_SSH_KEY_PASSPHRASE }}
          envs: DEPLOY_DOTENV,DEPLOY_PATH,IMAGE_TAG,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            printf '%s\n' "$DEPLOY_DOTENV" > .env
            export IMAGE_TAG
            echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
